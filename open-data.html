<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Open Data | CaribbeanSaaS</title>
<meta name="description" content="View, copy, and download the complete CaribbeanSaaS product catalog as JSON, including product details and logo URLs."/>
<meta name="robots" content="index, follow"/>
<meta name="theme-color" content="#0B0F12"/>
<link rel="canonical" href="https://caribbeansaas.com/open-data.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="CaribbeanSaaS"/>
<meta property="og:title" content="Open Data | CaribbeanSaaS"/>
<meta property="og:description" content="Copy or download every public CaribbeanSaaS product record as JSON, including product details and logo URLs."/>
<meta property="og:url" content="https://caribbeansaas.com/open-data.html"/>
<meta property="og:image" content="https://caribbeansaas.com/assets/brand/caribbeansaas-logo.png"/>
<meta property="og:image:alt" content="CaribbeanSaaS island technology logo"/>
<link rel="icon" href="assets/brand/favicon-centered.ico" sizes="any"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="assets/styles/utilities.css"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "CaribbeanSaaS public catalog",
  "description": "Public-safe catalog records for Caribbean software and digital platforms, including listed and unlisted visibility labels.",
  "url": "https://caribbeansaas.com/open-data.html",
  "creator": {
    "@type": "Organization",
    "name": "CaribbeanSaaS",
    "url": "https://caribbeansaas.com/"
  },
  "distribution": {
    "@type": "DataDownload",
    "encodingFormat": "application/json",
    "contentUrl": "https://caribbeansaas.com/data/products.json"
  }
}
</script>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; background: #0B0F12; color: #F4F7F8; font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
    a { color: inherit; }
    a:hover { color: #7FE7F2; }
    :focus-visible { outline: 2px solid #00C2D7; outline-offset: 4px; }
    main { width: 100%; max-width: 1440px; margin: 0 auto; padding: 24px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid #25313A; padding-bottom: 20px; }
    .brand { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; font-weight: 750; font-size: 14px; letter-spacing: .09em; }
    .brand span { color: #FF7A59; }
    .back-link { display: inline-flex; align-items: center; min-height: 44px; color: #A6B6BF; font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; padding: 28px 0 20px; }
    .intro { min-width: 0; }
    h1 { margin: 0; font-family: 'Space Grotesk', ui-sans-serif, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.03em; }
    #catalogStatus { margin: 7px 0 0; color: #A6B6BF; font-size: 13px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1px solid #344651; background: #12181D; padding: 10px 16px; color: #F4F7F8; font: 600 13px/1.4 Geist, ui-sans-serif, sans-serif; text-decoration: none; cursor: pointer; }
    .action:hover { background: #17252D; border-color: #00C2D7; color: #F4F7F8; }
    .action-primary { border-color: #00C2D7; background: #00C2D7; color: #071114; }
    .action-primary:hover { background: #7FE7F2; color: #071114; }
    .action:disabled { cursor: wait; opacity: .55; }
    .file-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 18px; border: 1px solid #25313A; background: #12181D; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .file-bar a { color: #7FE7F2; overflow-wrap: anywhere; }
    #copyStatus { min-height: 18px; color: #A6B6BF; font: 12px/1.5 Geist, ui-sans-serif, sans-serif; }
    #jsonView { width: 100%; max-width: 100%; min-height: 20rem; height: 68vh; height: 68dvh; margin: 0; overflow: auto; overscroll-behavior: contain; border: 1px solid #25313A; border-top: 0; background: #0E1419; padding: 20px; color: #C5E4E5; tab-size: 2; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #jsonView code { font: inherit; }
    #errorState { margin: 0; padding: 24px; border: 1px solid #FF7A59; color: #F4F7F8; line-height: 1.7; }
    #retryLoad { margin-top: 16px; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 16px 0; color: #A6B6BF; font-size: 12px; line-height: 1.7; }
    footer p { margin: 0; }
    footer nav { display: flex; gap: 20px; }
    footer a { display: inline-flex; align-items: center; min-height: 44px; }
    [hidden] { display: none !important; }
    @media (max-width: 540px) {
        main { padding: 16px; }
        header { gap: 4px 12px; padding-bottom: 12px; }
        .brand { font-size: 12px; letter-spacing: .06em; }
        .back-link { font-size: 12px; }
        .toolbar { padding-top: 22px; }
        .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
        .action { padding-inline: 10px; }
        #jsonView { padding: 14px; font-size: 12px; }
        .file-bar { padding: 12px 14px; }
    }
</style>
</head>
<body>
<main>
    <header>
        <a class="brand" href="index.html" aria-label="CaribbeanSaaS home">Caribbean<span>SaaS</span></a>
        <a class="back-link" href="index.html#directory">Back to directory ↗</a>
    </header>
    <section aria-labelledby="openDataHeading">
        <div class="toolbar">
            <div class="intro">
                <h1 id="openDataHeading">Open Data</h1>
                <p id="catalogStatus" role="status" aria-live="polite">Loading the complete product catalog…</p>
            </div>
            <div class="actions">
                <button id="copyJson" class="action action-primary" type="button" disabled>Copy JSON</button>
                <a id="downloadJson" class="action" href="data/products.json" download="caribbeansaas-products.json">Download JSON</a>
            </div>
        </div>
        <div class="file-bar">
            <a id="rawJsonLink" href="data/products.json">data/products.json ↗</a>
            <span id="copyStatus" role="status" aria-live="polite" aria-atomic="true"></span>
        </div>
        <pre id="jsonView" tabindex="0" aria-label="Complete product catalog JSON" aria-busy="true"><code id="jsonContent"></code></pre>
        <div id="errorState" role="alert" hidden>
            <p>The JSON preview could not load. Try again or <a href="data/products.json">open the source file</a>.</p>
            <button id="retryLoad" class="action" type="button">Try again</button>
        </div>
        <noscript><p>JavaScript is needed for the preview and copy button. You can still <a href="data/products.json">open</a> or <a href="data/products.json" download="caribbeansaas-products.json">download the complete JSON catalog</a>.</p></noscript>
    </section>
    <footer>
        <p>All public products, including unlisted records. Product logos are linked in <code>logoUrl</code>.</p>
        <nav aria-label="Data information"><a href="curation.html">Listing policy</a><a href="terms.html">Terms</a><a class="focus-ring inline-flex h-10 w-10 items-center justify-center rounded-sm text-white/45 transition-colors hover:text-white" href="https://github.com/caynetic/caribbeansaas" target="_blank" rel="noopener noreferrer" aria-label="Follow CaribbeanSaaS on GitHub" title="Follow on GitHub">
            <svg class="h-5 w-5" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8a8.003 8.003 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
        </a></nav>
    </footer>
</main>
<script>
(() => {
    const content = document.getElementById("jsonContent");
    const view = document.getElementById("jsonView");
    const status = document.getElementById("catalogStatus");
    const copyStatus = document.getElementById("copyStatus");
    const copyButton = document.getElementById("copyJson");
    const errorState = document.getElementById("errorState");
    let catalogJson = "";

    async function loadCatalog() {
        copyButton.disabled = true;
        errorState.hidden = true;
        view.hidden = false;
        view.setAttribute("aria-busy", "true");
        status.textContent = "Loading the complete product catalog…";
        try {
            const response = await fetch("data/products.json");
            if (!response.ok) throw new Error("Catalog request failed");
            const catalog = await response.json();
            if (catalog.schemaVersion !== 2 || !Array.isArray(catalog.products)) {
                throw new Error("Invalid catalog");
            }
            catalogJson = JSON.stringify(catalog, null, 2) + "\n";
            content.textContent = catalogJson;
            status.textContent = `${catalog.products.length} products · Schema ${catalog.schemaVersion} · JSON`;
            copyButton.disabled = false;
        } catch {
            status.textContent = "Preview unavailable";
            view.hidden = true;
            errorState.hidden = false;
        } finally {
            view.setAttribute("aria-busy", "false");
        }
    }

    copyButton.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(catalogJson);
            copyStatus.textContent = "Complete JSON copied.";
        } catch {
            view.focus();
            const range = document.createRange();
            range.selectNodeContents(content);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            copyStatus.textContent = "JSON selected. Use your device’s Copy command, or Download JSON.";
        }
    });
    document.getElementById("retryLoad").addEventListener("click", loadCatalog);
    loadCatalog();
})();
</script>
</body>
</html>
